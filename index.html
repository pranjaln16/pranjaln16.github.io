<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>geekin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
  --bg:#000; --fg:#fff; --dim:#9a9a9a; --pick:#ff0; --soul:#f00;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"VT323","Courier New",monospace; font-size:28px; line-height:1.3;
  min-height:100vh;
}
main{position:relative; z-index:1; max-width:760px; margin:0 auto; padding:40px 20px 64px}
h1{
  font:400 14px/1.6 "Press Start 2P","Courier New",monospace;
  margin:0 0 28px; letter-spacing:.04em;
}
#box{
  border:6px solid var(--fg); padding:22px 26px; min-height:11em;
  background:var(--bg); max-height:min(60vh,540px); overflow-y:auto; cursor:pointer; font-size:32px; line-height:1.3;
}
.ln{padding-left:2ch; text-indent:-2ch}
.ln.by{padding-left:0; text-indent:0; color:var(--dim); margin-top:.7em}
#snow{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
.prism{position:relative; width:100%; aspect-ratio:190/68; margin:0 0 26px}
.prism canvas{position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
#cBeam{animation:reveal .5s steps(10) .2s both}
#cFan{animation:reveal 1s steps(24) .8s both}
.now{margin:30px 0 0; padding-left:14px; font-size:24px; color:var(--dim);
  border-left:6px solid; border-image:linear-gradient(#e40303,#ff8c00,#ffed00,#008026,#004dff,#750787) 1}
@media (prefers-reduced-motion:reduce){#cBeam,#cFan{animation:none}}
.date{color:var(--dim); font-size:.8em; margin-bottom:.5em}
.pic{display:block; width:100%; max-width:100%; height:auto; border:4px solid var(--fg); margin:0 0 .8em}
canvas.pic{image-rendering:pixelated}
.lnk{display:block; margin-top:.7em; padding-left:2ch; text-indent:-2ch; color:var(--pick)}
.lnk:hover{text-decoration:underline}
.pw{display:block}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
#menu{margin:30px 0 0; display:flex; flex-direction:column; gap:2px; border:6px solid var(--fg); background:var(--bg); padding:10px 14px; max-height:300px; overflow-y:auto; overscroll-behavior:contain}
#menu,#box{scrollbar-width:thin; scrollbar-color:#fff #000}
#menu::-webkit-scrollbar,#box::-webkit-scrollbar{width:12px}
#menu::-webkit-scrollbar-track,#box::-webkit-scrollbar-track{background:#000; border-left:2px solid #fff}
#menu::-webkit-scrollbar-thumb,#box::-webkit-scrollbar-thumb{background:#fff}
#menu button{
  display:grid; grid-template-columns:34px 1fr; align-items:center; text-align:left;
  background:none; border:0; color:var(--fg); font:inherit; font-size:30px;
  padding:4px 6px; cursor:pointer; border-radius:0; flex:none;
}
#menu button:hover,#menu button:focus-visible,#menu button[aria-current]{color:var(--pick); outline:none}
.h{width:24px; height:21px; fill:var(--soul); visibility:hidden; shape-rendering:crispEdges}
#menu button:hover .h,#menu button:focus-visible .h,#menu button[aria-current] .h{visibility:visible}
.hint{margin:34px 0 0; color:var(--dim); font-size:22px}
@media (max-width:520px){
  body{font-size:24px} #box{font-size:27px; padding:16px 16px; border-width:5px}
  #menu button{font-size:26px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="heart" viewBox="0 0 9 8">
    <rect x="2" y="0" width="2" height="1"/><rect x="5" y="0" width="2" height="1"/>
    <rect x="1" y="1" width="7" height="1"/><rect x="0" y="2" width="9" height="2"/>
    <rect x="1" y="4" width="7" height="1"/><rect x="2" y="5" width="5" height="1"/>
    <rect x="3" y="6" width="3" height="1"/><rect x="4" y="7" width="1" height="1"/>
  </symbol>
</svg>
<canvas id="snow" aria-hidden="true"></canvas>
<main>
  <div class="prism" role="img" aria-label="Pixel art of a white beam entering a prism and leaving as a rainbow, like the Dark Side of the Moon cover">
    <canvas id="cFan" width="190" height="68"></canvas>
    <canvas id="cBeam" width="190" height="68"></canvas>
    <canvas id="cPrism" width="190" height="68"></canvas>
  </div>
  <h1>* A few good passages</h1>
  <div id="box" aria-hidden="true" title="Click to skip the typing"><div id="media"></div><div id="txt"></div><div id="extra"></div></div>
  <div id="sr" class="sr" aria-live="polite"></div>
  <nav id="menu" aria-label="is it u?"></nav>
  <p class="hint">* Use the arrow keys or tap a title. Click the box to skip the typing.</p>
</main>
<script>
// Add, remove or edit passages here. "text" can hold several paragraphs separated by \n.
// Optional extras on any entry:
//   date:"Oct 24, 2026"                          shown above the text
//   img:"photo.jpg"  or  imgs:["a.png","b.png"]  pictures uploaded next to index.html (several are stacked; scroll the box)
//   alt:"what it shows"                          describes the pictures for screen readers
//   pixel:96                                     pixelates the pictures to 96 pixels wide
//   link:{url:"art.pdf", label:"Open the PDF"}   a link (a PDF, a song, anything) shown after the text
//   link:[{url:"...",label:"..."},{url:"...",label:"..."}]   or several links
//   instant:true                                 skips the typing for this entry
// Clicking a picture opens your link, or the full-size picture if the entry has no link.
const ENTRIES=[
  {title:"I cant and wont bear it.",
   text:"The word's I want to express, can never be fully written down",
   note:`I only hope you (all) live happily,`,
   note:`I can only hope you remember me forever.` },
  {title:"Being good means being free.", by:"Shoyo Hinata, Haikyuu!!",
   text:"Being good means being free.",
   note:`I have never felt free, does this mean I've never been good?`},  ];
  // {title:"Your own words", by:"You",
  //  date:"Oct 24, 2026", link:{url:"https://example.com", label:"A link goes here"},
  //  text:"Replace this with a passage you want to keep."} ];


const box=document.getElementById('box'), sr=document.getElementById('sr'), menu=document.getElementById('menu');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur=-1, timer=null, full='', lastIdx=0, n=0;

const txt=document.getElementById('txt'), media=document.getElementById('media'), extra=document.getElementById('extra');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
  const parts=full.slice(0,n).split('\n');
  txt.innerHTML=parts.map((p,i)=>'<div class="ln'+(i===lastIdx?' by':'')+'">'+(p?esc(p):'&#8203;')+'</div>').join('');
}
function showMedia(e){
  media.innerHTML='';
  if(e.date){ const d=document.createElement('div'); d.className='date'; d.textContent=e.date; media.append(d); }
  const pics=e.imgs||(e.img?[e.img]:[]);
  const links=[].concat(e.link||[]);
  pics.forEach(src=>{
    // clicking a picture opens the entry's link, or the full-size picture if there is no link
    const a=document.createElement('a');
    a.className='pw'; a.href=links.length?links[0].url:src; a.target='_blank'; a.rel='noopener';
    if(e.pixel){
      // pixelate: draw the picture tiny, then let CSS scale it up with hard edges
      const cv=document.createElement('canvas'), im=new Image();
      cv.className='pic'; cv.setAttribute('role','img'); cv.setAttribute('aria-label',e.alt||'');
      im.onload=()=>{ const w=e.pixel, h=Math.max(1,Math.round(w*im.naturalHeight/im.naturalWidth)); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h); };
      im.src=src; a.append(cv);
    } else {
      const im=document.createElement('img');
      im.className='pic'; im.src=src; im.alt=e.alt||''; im.loading='lazy'; a.append(im);
    }
    media.append(a);
  });
}
function showExtra(e){
  extra.innerHTML='';
  [].concat(e.link||[]).forEach(l=>{
    const a=document.createElement('a');
    a.className='lnk'; a.href=l.url; a.target='_blank'; a.rel='noopener';
    a.textContent='* '+(l.label||l.url);
    extra.append(a);
  });
}
function finish(){ clearInterval(timer); n=full.length; render(); if(cur>=0) showExtra(ENTRIES[cur]); }
function select(i){
  cur=i; clearInterval(timer);
  const e=ENTRIES[i];
  const lines=e.text.split('\n').map(t=>'* '+t);
  lines.push('\u2014 '+e.by);
  lastIdx=lines.length-1;
  if(e.note){ lines.push(''); e.note.split('\n').forEach(t=>{ t=t.trim(); lines.push(t?'* '+t:''); }); }
  full=lines.join('\n'); n=0;
  sr.textContent=e.text.replace(/\n/g,' ')+' \u2014 '+e.by+(e.date?' ('+e.date+')':'');
  [...menu.children].forEach((b,j)=>{ if(j===i) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current'); });
  showMedia(e); extra.innerHTML='';
  if(reduce||e.instant){ finish(); return; }
  render();
  // long entries type faster so they take about 12 seconds at most
  const step=Math.max(1,Math.ceil(full.length/450));
  timer=setInterval(()=>{ n=Math.min(full.length,n+step); render(); if(n>=full.length){ clearInterval(timer); showExtra(e); } },26);
}

ENTRIES.forEach((e,i)=>{
  const b=document.createElement('button');
  b.type='button';
  b.innerHTML='<svg class="h" aria-hidden="true"><use href="#heart"/></svg><span></span>';
  b.lastChild.textContent=e.title;
  b.addEventListener('click',()=>select(i));
  menu.append(b);
});
menu.addEventListener('keydown',ev=>{
  if(ev.key!=='ArrowDown'&&ev.key!=='ArrowUp') return;
  ev.preventDefault();
  const N=ENTRIES.length, at=[...menu.children].indexOf(document.activeElement);
  const j=(at+(ev.key==='ArrowDown'?1:-1)+N)%N;
  menu.children[j].focus(); select(j);
});
box.addEventListener('click',()=>{ if(cur>=0) finish(); });

// Pixel-art prism, drawn on a 190x68 grid and scaled up with hard pixel edges
(function(){
  const W=190, AX=95, TOP=6, BASE=64, HB=34;      // prism: apex, base row, half base
  const AY=36, BX=109, BY=30;                      // beam enters left face at (77,36), leaves right face at (109,30)
  const get=id=>document.getElementById(id).getContext('2d');
  const put=(c,x,y,col)=>{c.fillStyle=col; c.fillRect(x,y,1,1);};
  const inside=(x,y)=>y>=TOP&&y<=BASE&&Math.abs(x+.5-AX)<=HB*(y-TOP+.5)/(BASE-TOP);

  // incoming white beam
  const cb=get('cBeam');
  for(let x=0;x<=78;x++){ const y=Math.round(52+(AY-52)*x/77); put(cb,x,y,'#fff'); put(cb,x,y+1,'#fff'); }

  // spectrum: six bands fanning out from the exit point
  const cf=get('cFan'), bands=['#e40303','#ff8c00','#ffed00','#008026','#004dff','#750787'];
  for(let x=BX+1;x<W;x++){
    const f=(x-BX)/(W-1-BX);
    for(let k=0;k<6;k++){
      const y0=Math.round(BY+(4+4*k)*f), y1=Math.round(BY+(4+4*(k+1))*f);
      for(let y=y0;y<y1;y++) put(cf,x,y,bands[k]);
    }
  }

  // prism: dark glass, dithered shading, bright edges, light passing through
  const cp=get('cPrism');
  for(let y=TOP;y<=BASE;y++) for(let x=0;x<W;x++){
    if(!inside(x,y)) continue;
    const edge=!inside(x-1,y)||!inside(x+1,y)||!inside(x,y-1)||!inside(x,y+1);
    let col;
    if(edge) col = y>=BASE ? '#6f93a8' : (x<AX ? '#eaf6ff' : '#a9cbe0');
    else col = (((x+y)&1)===0 && x<AX+8) ? '#0b2231' : '#06141f';
    put(cp,x,y,col);
  }
  for(let x=AX-18;x<=BX;x++){
    const y=Math.round(AY+(BY-AY)*(x-(AX-18))/(BX-(AX-18)));
    if(x<78) continue;
    put(cp,x,y,'#fff'); put(cp,x,y+1,'#fff');
    if((x&1)===0){ put(cp,x,y-1,'#bfe0f2'); put(cp,x,y+2,'#bfe0f2'); }
  }
  put(cp,AX,TOP,'#fff');
})();

// Falling pixel snow (skipped if the viewer prefers reduced motion)
(function(){
  if(reduce) return;
  const c=document.getElementById('snow'), x=c.getContext('2d');
  let w,h,t0=performance.now(); const flakes=[];
  function size(){const d=devicePixelRatio||1; w=innerWidth; h=innerHeight; c.width=w*d; c.height=h*d; x.setTransform(d,0,0,d,0,0);}
  function mk(top){return {x:Math.random()*w, y:top?-10:Math.random()*h, s:Math.random()<.25?4:2, v:30+Math.random()*50, a:Math.random()*6.28, sw:10+Math.random()*20};}
  size(); for(let i=0;i<70;i++) flakes.push(mk(false));
  addEventListener('resize',size);
  function frame(t){
    const dt=Math.min((t-t0)/1000,.1); t0=t;
    x.clearRect(0,0,w,h); x.fillStyle='#fff';
    for(const f of flakes){
      f.y+=f.v*dt; f.a+=dt; f.x+=Math.sin(f.a)*f.sw*dt;
      if(f.y>h+10) Object.assign(f,mk(true));
      x.globalAlpha=f.s>2?.9:.55;
      x.fillRect(Math.round(f.x/2)*2,Math.round(f.y/2)*2,f.s,f.s);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

// Keep the box following the typing, unless the reader has scrolled up
const _render=render;
render=function(){
  const stick=box.scrollHeight-box.scrollTop-box.clientHeight<12;
  _render();
  if(stick) box.scrollTop=box.scrollHeight;
};

select(0);
</script>
</body>
</html>
